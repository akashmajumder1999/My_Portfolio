<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>student result sheets</title>
</head>
<body>
    <h1 align="center">student result sheets</h1>
    <table border="1" callpading="10" cellspacing="0" align="center">
        <thead>
            <tr>
                <th rowspan="2">id</th>
                <th rowspan="2">name</th>
                <th rowspan="3">marks</th>
                <th rowspan="2">total</th>
                <th rowspan="2">grade</th>
            </tr>

            <tr>
                <th>math</th>
                <th>english</th>
                <th>ICT</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>102</td>
                <td>rahim</td>
                <td>90</td>
                <td>85</td>
                <td>95</td>
                <td>270</td>
                <td>A+</td>
            </tr>

            <tr>
                <td>103</td>
                <td>akash</td>
                <td>75</td>
                <td>70</td>
                <td>70</td>
                <td>215</td>
                <td>A</td>
            </tr>

            <tr>
                <td>104</td>
                <td>sadia</td>
                <td>75</td>
                <td>70</td>
                <td>70</td>
                <td>215</td>
                <td>A</td>
            </tr>
        </tbody>

        <tfoot>
            <tr>
                <td colspan="5" align="right">
                    <b>student:</b>
                </td>
                <td colspan="2">
                    <b>3</b>
                </td>
            </tr>
        </tfoot>
    </table>

</body>
</html>
